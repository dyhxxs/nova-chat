name: Bug report
description: 报告可复现的问题，帮助我们修复它
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请删除 API Key、密码、Token、SERVER_MASTER_KEY、真实域名和私人聊天内容。
  - type: input
    id: version
    attributes:
      label: Nova Chat 版本
      placeholder: "例如 1.1.13"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 请填写设备、系统版本、Gateway 部署方式和 API 模式。
      placeholder: "Pixel 8 / Android 15 / Docker Compose / Responses"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写出最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏日志
    validations:
      required: true
