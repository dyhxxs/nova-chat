name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    # Pin the runner image so CI does not change under us during the Ubuntu 26 migration.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The gateway uses node:sqlite with SQLite FTS5. Node 24 is the
          # first supported runtime in this project that ships that module
          # in the official GitHub runner build.
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run security:audit:gateway
      - run: npm run verify
      - run: npm run build
      - name: Validate and build the production gateway image
        run: |
          cp services/gateway/.env.example services/gateway/.env
          docker compose config --quiet
          docker compose build gateway
      - name: Start the production gateway and verify readiness
        run: |
          docker compose up -d gateway
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/readyz; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=100 gateway
          exit 1
      - name: Stop the production gateway
        if: always()
        run: |
          if [ -f services/gateway/.env ]; then
            docker compose down -v
          else
            echo "Gateway was not started; no environment file to clean up."
          fi
      - run: npx expo export --platform android --output-dir dist/android-bundle --clear
        working-directory: apps/mobile
      - run: npx expo export --platform ios --output-dir dist/ios-bundle --clear
        working-directory: apps/mobile
